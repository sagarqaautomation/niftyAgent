name: NiftyAgent tests and backtest

# Run every commit independently; do not cancel earlier checks.
concurrency:
  group: nifty-agent-ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nifty_intraday_agent_complete
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nifty_intraday_agent_complete/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  walk-forward-backtest:
    name: Walk-forward backtest (win-rate report)
    runs-on: ubuntu-latest
    needs: unit-tests
    defaults:
      run:
        working-directory: nifty_intraday_agent_complete
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nifty_intraday_agent_complete/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Download historical NIFTY data from Kite when missing
        if: always()
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
        shell: bash
        run: |
          if [ -s data/nifty_1m.csv ]; then
            echo "Historical CSV already exists; keeping the checked-in dataset."
          elif [ -n "$KITE_API_KEY" ] && [ -n "$KITE_ACCESS_TOKEN" ]; then
            echo "Attempting to download the last six months of NIFTY 1-minute candles from Kite."
            if ! python download_nifty_data.py --months 6 --output data/nifty_1m.csv; then
              echo "::warning::Kite download failed. Check that the access token is still valid and has historical-data access."
              rm -f data/nifty_1m.csv
            fi
          else
            echo "Kite secrets are not available to this workflow run; skipping download."
          fi
      - name: Check for historical NIFTY data
        id: data
        shell: bash
        run: |
          if [ -s data/nifty_1m.csv ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Found data/nifty_1m.csv"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Backtest skipped: data/nifty_1m.csv is not present in this checkout."
            {
              echo "## Walk-forward backtest"
              echo ""
              echo "**Skipped:** `data/nifty_1m.csv` is not present. Add the real historical NIFTY 1-minute OHLCV CSV at that path to enable win-rate reporting."
              echo ""
              echo "Required columns: `timestamp,open,high,low,close,volume`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run walk-forward backtest with estimated costs
        if: steps.data.outputs.available == 'true'
        run: |
          python backtester.py data/nifty_1m.csv --walk-forward --folds 5 --progress --round-trip-cost-points 2 2>&1 | tee backtest-console.log
          test ${PIPESTATUS[0]} -eq 0
          # Keep the JSON report separately so it can be downloaded as an artifact.
          python backtester.py data/nifty_1m.csv --walk-forward --folds 5 --round-trip-cost-points 2 > backtest-report.json
      - name: Add backtest metrics to run summary
        if: steps.data.outputs.available == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("backtest-report.json").read_text(encoding="utf-8"))
          lines = [
              "## Walk-forward backtest results",
              "",
              "Estimated round-trip cost: **2 index points**. Each fold reports out-of-sample validation metrics.",
              "",
              "| Fold | Baseline win rate | Baseline trades | Probability-filtered win rate | Filtered trades | Quality-filtered win rate | Quality-filtered trades |",
              "|---:|---:|---:|---:|---:|---:|---:|",
          ]
          for fold in report:
              baseline = fold.get("baseline", {})
              probability = fold.get("probability_filtered", {})
              quality = fold.get("trade_quality_filtered", {})
              def fmt(value):
                  return "N/A" if value is None else f"{value}%"
              lines.append(
                  f"| {fold.get('fold', 'N/A')} "
                  f"| {fmt(baseline.get('win_rate_percent'))} "
                  f"| {baseline.get('resolved', 0)} "
                  f"| {fmt(probability.get('win_rate_percent'))} "
                  f"| {probability.get('resolved', 0)} "
                  f"| {fmt(quality.get('win_rate_percent'))} "
                  f"| {quality.get('resolved', 0)} |"
              )
          lines.extend([
              "",
              "Win rate is calculated on resolved SUCCESS/FAILED trades; ambiguous and expired signals are reported separately in the JSON artifact.",
              "Do not treat a high win rate alone as proof of profitability; review net average R, net profit factor, sample size, and costs.",
          ])
          Path("backtest-summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          with Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as f:
              f.write(Path("backtest-summary.md").read_text(encoding="utf-8"))
          PY
      - name: Upload backtest report
        if: always() && steps.data.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: niftyagent-backtest-${{ github.sha }}
          path: |
            nifty_intraday_agent_complete/backtest-report.json
            nifty_intraday_agent_complete/backtest-console.log
          if-no-files-found: warn
          retention-days: 30
