name: NiftyAgent tests

# Run tests for every push and pull request on branches containing this workflow.
# Give each commit its own run so newer changes do not cancel earlier results.
concurrency:
  group: nifty-agent-tests-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nifty_intraday_agent_complete
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nifty_intraday_agent_complete/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
